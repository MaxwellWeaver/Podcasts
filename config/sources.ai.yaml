# RSS sources for the weekly AI Capabilities podcast.

sources:
  # --- Lab / company blogs ---
  - name: Anthropic News
    url: https://www.anthropic.com/news/rss.xml
    category: lab
    weight: 1.5
    max_items_per_run: 8

  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: lab
    weight: 1.5
    max_items_per_run: 8

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    category: lab
    weight: 1.4
    max_items_per_run: 6

  - name: Meta AI
    url: https://ai.meta.com/blog/rss/
    category: lab
    weight: 1.2
    max_items_per_run: 6

  - name: Mistral News
    url: https://mistral.ai/news/feed.xml
    category: lab
    weight: 1.1
    max_items_per_run: 4

  # --- Aggregators / commentary ---
  - name: Import AI (Jack Clark)
    url: https://importai.substack.com/feed
    category: commentary
    weight: 1.4
    max_items_per_run: 3

  - name: The Batch (DeepLearning.AI)
    url: https://www.deeplearning.ai/the-batch/feed/
    category: commentary
    weight: 1.2
    max_items_per_run: 3

  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    category: commentary
    weight: 1.3
    max_items_per_run: 6

  # --- Research papers ---
  - name: arXiv cs.AI
    url: https://export.arxiv.org/rss/cs.AI
    category: research
    weight: 0.9
    max_items_per_run: 12

  - name: arXiv cs.CL
    url: https://export.arxiv.org/rss/cs.CL
    category: research
    weight: 1.0
    max_items_per_run: 12

  - name: arXiv cs.LG
    url: https://export.arxiv.org/rss/cs.LG
    category: research
    weight: 0.9
    max_items_per_run: 12

  # --- Community ---
  - name: r/MachineLearning weekly top
    url: https://www.reddit.com/r/MachineLearning/top/.rss?t=week
    category: community
    weight: 0.8
    max_items_per_run: 6
