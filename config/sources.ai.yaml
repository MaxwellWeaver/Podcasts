# RSS sources for the weekly AI Capabilities podcast.
#
# Note on official lab feeds: Anthropic, Meta AI, Mistral, and DeepLearning.AI's
# The Batch dropped public RSS at some point. Their releases are still surfaced
# via Simon Willison, Import AI, Hugging Face Blog, Hacker News, and r/ML — those
# are arguably better signals than the lab blogs anyway because they're curated.

sources:
  # --- Lab / company blogs (the few that still publish RSS) ---
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: lab
    weight: 1.5
    max_items_per_run: 8

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    category: lab
    weight: 1.4
    max_items_per_run: 6

  - name: Google AI Blog
    url: https://feeds.feedburner.com/blogspot/gJZg
    category: lab
    weight: 1.3
    max_items_per_run: 6

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: lab
    weight: 1.0
    max_items_per_run: 6

  # --- Curators / commentary (the actual signal layer for AI news) ---
  - name: Import AI (Jack Clark)
    url: https://importai.substack.com/feed
    category: commentary
    weight: 1.5
    max_items_per_run: 3

  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    category: commentary
    weight: 1.4
    max_items_per_run: 8

  - name: Ahead of AI (Sebastian Raschka)
    url: https://magazine.sebastianraschka.com/feed
    category: commentary
    weight: 1.3
    max_items_per_run: 3

  - name: Interconnects (Nathan Lambert)
    url: https://www.interconnects.ai/feed
    category: commentary
    weight: 1.3
    max_items_per_run: 4

  - name: AI as Normal Technology (Snake Oil)
    url: https://www.aisnakeoil.com/feed
    category: commentary
    weight: 1.2
    max_items_per_run: 3

  - name: Latent Space
    url: https://www.latent.space/feed
    category: commentary
    weight: 1.1
    max_items_per_run: 4

  - name: Lil'Log (Lilian Weng)
    url: https://lilianweng.github.io/index.xml
    category: commentary
    weight: 1.3
    max_items_per_run: 2

  # --- Research papers ---
  - name: arXiv cs.AI
    url: https://export.arxiv.org/rss/cs.AI
    category: research
    weight: 0.9
    max_items_per_run: 10

  - name: arXiv cs.CL
    url: https://export.arxiv.org/rss/cs.CL
    category: research
    weight: 1.0
    max_items_per_run: 10

  - name: arXiv cs.LG
    url: https://export.arxiv.org/rss/cs.LG
    category: research
    weight: 0.9
    max_items_per_run: 10

  # --- Community ---
  - name: Hacker News AI tag (>=100 points)
    url: https://hnrss.org/newest?points=100&q=AI
    category: community
    weight: 0.9
    max_items_per_run: 6

  - name: r/MachineLearning weekly top
    url: https://www.reddit.com/r/MachineLearning/top/.rss?t=week
    category: community
    weight: 0.8
    max_items_per_run: 6
