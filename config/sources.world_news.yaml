# RSS sources for the daily World News podcast.
# Edit freely — this is read fresh each run.
#
# Schema per entry:
#   name:     human label
#   url:      RSS / Atom feed URL
#   category: geopolitics | defense | tech | security
#   weight:   ranking multiplier (default 1.0)
#   max_items_per_run: cap per feed per run

sources:
  # --- Geopolitics / world news ---
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    category: geopolitics
    weight: 1.0
    max_items_per_run: 8

  - name: Reuters World (via Google News)
    url: https://news.google.com/rss/search?q=when:2d+site:reuters.com+(world+OR+ukraine+OR+china+OR+iran+OR+israel)&hl=en-US&gl=US&ceid=US:en
    category: geopolitics
    weight: 1.2
    max_items_per_run: 8

  - name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    category: geopolitics
    weight: 1.0
    max_items_per_run: 6

  - name: Foreign Policy
    url: https://foreignpolicy.com/feed/
    category: geopolitics
    weight: 1.3
    max_items_per_run: 5

  - name: War on the Rocks
    url: https://warontherocks.com/feed/
    category: geopolitics
    weight: 1.4
    max_items_per_run: 4

  # ISW (Institute for the Study of War) dropped their public RSS feed at some
  # point. Their daily Russian Offensive Campaign Assessment is high-signal but
  # would need a custom HTML scraper. Foreign Policy + War on the Rocks +
  # Defense News substantially cover the same Ukraine/Russia ground.

  # --- Defense tech ---
  - name: Defense News
    url: https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml
    category: defense
    weight: 1.3
    max_items_per_run: 6

  - name: Breaking Defense
    url: https://breakingdefense.com/feed/
    category: defense
    weight: 1.3
    max_items_per_run: 6

  - name: The War Zone
    url: https://www.twz.com/feed
    category: defense
    weight: 1.2
    max_items_per_run: 5

  - name: Naval News
    url: https://www.navalnews.com/feed/
    category: defense
    weight: 1.0
    max_items_per_run: 4

  # --- Tech news ---
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    category: tech
    weight: 1.0
    max_items_per_run: 5

  - name: Hacker News front page
    url: https://hnrss.org/frontpage?points=200
    category: tech
    weight: 0.8
    max_items_per_run: 5

  - name: Schneier on Security
    url: https://www.schneier.com/feed/atom/
    category: security
    weight: 1.2
    max_items_per_run: 3
