[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcastgen"
version = "0.1.0"
description = "Automated podcast pipeline: sources -> script -> Kokoro TTS -> RSS feed"
requires-python = ">=3.12"
dependencies = [
    # Source intake
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "trafilatura>=1.12",
    # Knowledge store
    "python-frontmatter>=1.1",
    # Script + audio
    "pyyaml>=6.0",
    "click>=8.1",
    "pydub>=0.25",
    "mutagen>=1.47",
    # Feed generation
    "feedgen>=1.0.0",
    # Misc
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
tts = [
    # Kokoro pulls torch (several GB). Install only when needed for phase 5+.
    "kokoro>=0.7.0",
    "soundfile>=0.12",
]
notify = [
    "win10toast>=0.9",
]
api = [
    # Future swap from Claude CLI to direct Anthropic SDK
    "anthropic>=0.40",
]

[project.scripts]
podcastgen = "podcastgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
